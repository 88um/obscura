name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "New release tag, or empty to build and warm the branch cache"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners are required for the architecture-specific V8 snapshot.
          # Ubuntu 22.04 keeps the binaries compatible with glibc 2.35.
          - os: ubuntu-22.04
            name: obscura-x86_64-linux
          - os: ubuntu-22.04-arm
            name: obscura-aarch64-linux
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install stealth build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.name }}-render-stealth
          cache-workspace-crates: true
          # Dispatch successive releases on the same branch to reuse this cache.
          # GitHub isolates caches written by tag-triggered runs to their tag.
          save-if: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Build release binaries
        run: cargo build --locked --release -p obscura-cli --bins --features render,stealth

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: nextest
          fallback: none

      - name: Verify scripted response events and bodies on both transports
        run: cargo nextest run --locked --release -p obscura-browser --features render,stealth --test scripted_network --test-threads 1

      - name: Verify native V8 snapshot and rendering
        run: |
          timeout 30s target/release/obscura --stealth fetch 'data:text/html,<title>ok</title>' --timeout 15 --eval '1+1'
          timeout 30s target/release/obscura --stealth fetch 'data:text/html,<style>body{margin:0;background:%23123456}</style>' --timeout 15 --screenshot smoke.png
          test -s smoke.png
          rm smoke.png

      - name: Package
        run: |
          tar czf ${{ matrix.name }}-stealth.tar.gz -C target/release obscura obscura-worker
          sha256sum ${{ matrix.name }}-stealth.tar.gz > ${{ matrix.name }}-stealth.tar.gz.sha256

      - name: Upload packaged binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.name }}
          path: |
            ${{ matrix.name }}-stealth.tar.gz
            ${{ matrix.name }}-stealth.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # Only completed artifacts reach the job holding the write token.
      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: dist/*
